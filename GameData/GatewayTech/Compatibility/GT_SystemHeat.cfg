// SystemHeat: the radiator wings become SystemHeat radiators (heat loops instead of the stock core-radiator model).
// Curve scale: Bluedog's MOL radiators give ~1 kW per 830 of stock maxEnergyTransfer at 400 K.
@PART[gt_IHabRadiator]:NEEDS[SystemHeat]
{
	MODULE
	{
		name = ModuleSystemHeat
		volume = 0.02
		moduleID = default
		iconName = Icon_Radiator
		ignoreTemperature = true
	}
	@MODULE[ModuleActiveRadiator]
	{
		@name = ModuleSystemHeatRadiator
		moduleID = radiator
		systemHeatModuleID = default
		scalarModuleID = heat
		maxTempAnimation = 500
		usePhysicalTemperatureModeling = false
		maxRadiatorTemperature = 350
		emissivity = 0.9
		temperatureCurve
		{
			key = 0 0
			key = 400 36
		}
		convectiveArea = 0.15
	}
}
