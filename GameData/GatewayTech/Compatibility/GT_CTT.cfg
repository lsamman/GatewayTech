// Community Tech Tree: move the parts onto CTT nodes (stock node names are used otherwise).
@PART[gt_PPE|gt_ROSA]:NEEDS[CommunityTechTree]:FOR[GatewayTech]
{
	@TechRequired = highTechElectricalSystems
}
@PART[gt_IHabRadiator|gt_AirlockRadiator]:NEEDS[CommunityTechTree]:FOR[GatewayTech]
{
	@TechRequired = largeElectrics
}
@PART[gt_HALO|gt_IHab|gt_ESPRIT|gt_Airlock|gt_Canadarm3|gt_DexArm]:NEEDS[CommunityTechTree]:FOR[GatewayTech]
{
	@TechRequired = orbitalAssembly
}
