// USI Life Support: Supplies and Mulch scaled to crew capacity (80 Supplies per crew loaded, 400 per crew of room), cost += Supplies x 2.5 as in Bluedog.
@PART[gt_HALO]:NEEDS[USILifeSupport]:FOR[GatewayTech]
{
	// HALO: 2 crew
	@cost += 400
	RESOURCE
	{
		name = Supplies
		amount = 160
		maxAmount = 800
	}
	RESOURCE
	{
		name = Mulch
		amount = 0
		maxAmount = 800
	}
}
