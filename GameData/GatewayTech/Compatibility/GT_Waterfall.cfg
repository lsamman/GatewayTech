// Waterfall: replace the PPE's stock ion particle plumes with Waterfall's xenon plume.
// The model has three large (plumeLarge) and four small (plumeSmall) thrusters; each name matches every thruster that carries it.
@PART[gt_PPE]:NEEDS[Waterfall]
{
	@EFFECTS
	{
		@IonPlume
		{
			!MODEL_MULTI_PARTICLE {}
		}
	}
	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = ionFX
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = throttle
			linkedTo = throttle
		}
		TEMPLATE
		{
			templateName = waterfall-ion-xenon-1
			overrideParentTransform = plumeLarge
			position = 0, 0, 0
			rotation = 0, 0, 0
			scale = 0.6, 0.6, 0.6
		}
		TEMPLATE
		{
			templateName = waterfall-ion-xenon-1
			overrideParentTransform = plumeSmall
			position = 0, 0, 0
			rotation = 0, 0, 0
			scale = 0.4, 0.4, 0.4
		}
	}
}
