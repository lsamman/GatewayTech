// ConnectedLivingSpace: crew can walk through the habitable modules; the arm mount and radiator mounts are not passages.
@PART[gt_HALO|gt_IHab|gt_ESPRIT|gt_Airlock]:HAS[!MODULE[ModuleConnectedLivingSpace]]:NEEDS[ConnectedLivingSpace]
{
	MODULE
	{
		name = ModuleConnectedLivingSpace
		passable = true
		impassablenodes = arm, radA, radB
	}
}
