// TAC Life Support: 33 days of supplies per crew member, scaled from HabTech2's Unity node (2 crew, 33 days).
@PART[gt_HALO]:NEEDS[TacLifeSupport]
{
	// HALO: 2 crew
	RESOURCE
	{
		name = Food
		amount = 24.134
		maxAmount = 24.134
	}
	RESOURCE
	{
		name = Water
		amount = 15.95
		maxAmount = 15.95
	}
	RESOURCE
	{
		name = Oxygen
		amount = 2442.836
		maxAmount = 2442.836
	}
	RESOURCE
	{
		name = CarbonDioxide
		amount = 0
		maxAmount = 2110.086
	}
	RESOURCE
	{
		name = Waste
		amount = 0
		maxAmount = 2.2
	}
	RESOURCE
	{
		name = WasteWater
		amount = 0
		maxAmount = 20.328
	}
}
