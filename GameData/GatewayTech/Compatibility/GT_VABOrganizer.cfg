// VAB Organizer sorting, using the subcategories HabTech2 and Bluedog use for the same kinds of part.
@PART[gt_HALO|gt_IHab]:NEEDS[VABOrganizer]
{
	%VABORGANIZER
	{
		%organizerSubcategory = crewHabitation
	}
}
@PART[gt_Airlock]:NEEDS[VABOrganizer]
{
	%VABORGANIZER
	{
		%organizerSubcategory = airlocks
	}
}
@PART[gt_ESPRIT]:NEEDS[VABOrganizer]
{
	%VABORGANIZER
	{
		%organizerSubcategory = xenon
	}
}
@PART[gt_PPE]:NEEDS[VABOrganizer]
{
	%VABORGANIZER
	{
		%organizerSubcategory = ionEngines
	}
}
@PART[gt_ROSA]:NEEDS[VABOrganizer]
{
	%VABORGANIZER
	{
		%organizerSubcategory = solarPanels
	}
}
@PART[gt_IHabRadiator|gt_AirlockRadiator]:NEEDS[VABOrganizer]
{
	%VABORGANIZER
	{
		%organizerSubcategory = radiators
	}
}
@PART[gt_Canadarm3|gt_DexArm]:NEEDS[VABOrganizer]
{
	%VABORGANIZER
	{
		%organizerSubcategory = misc
	}
}
